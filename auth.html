<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your FINISH learning account." />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in — FINISH.</title>
  <script>
    (() => {
      window.__FINISH_BOOT_STAGE__ = 'auth-html';
      window.__FINISH_LAST_ERROR__ = '';
      try {
        const saved = localStorage.getItem('finish-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
      const rememberError = (value) => { window.__FINISH_LAST_ERROR__ = String(value || 'Unknown browser error'); };
      addEventListener('error', (event) => rememberError(event.message || event.error));
      addEventListener('unhandledrejection', (event) => rememberError(event.reason?.message || event.reason));
      addEventListener('DOMContentLoaded', () => setTimeout(() => {
        if (window.__FINISH_ROUTER_READY__) return;
        const notice = document.createElement('aside');
        notice.className = 'boot-diagnostic';
        notice.innerHTML = `<strong>FINISH did not start.</strong><span>${window.__FINISH_LAST_ERROR__ || `Stopped at ${window.__FINISH_BOOT_STAGE__ || 'unknown stage'}.`}</span><button type="button" onclick="location.reload()">Reload</button>`;
        document.body.append(notice);
      }, 7000));
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/theme.css" />
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar shell"><a class="brand" href="/">FINISH<b>.</b></a><a href="/catalog">Browse courses</a></header>
    <main class="auth-page shell">
      <section class="auth-copy"><div class="eyebrow">YOUR LEARNING ACCOUNT</div><h1 class="display">Return to the right lesson.</h1><p class="lead">The sign-in interface is available as its own page. The application will activate it when the compiled bundle starts.</p></section>
      <section class="auth-card"><div class="auth-inner"><div class="eyebrow">FINISH ACCOUNT</div><h2>Welcome back.</h2><p class="muted">Loading secure sign in…</p><form class="form" onsubmit="event.preventDefault()"><label>EMAIL<input type="email" autocomplete="email" disabled></label><label>PASSWORD<input type="password" disabled></label><button class="btn" disabled>Starting FINISH…</button></form></div></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>

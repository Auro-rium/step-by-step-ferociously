name: Import FINISH playlists

on:
  push:
    branches: [main]
    paths:
      - content/playlists.json
      - scripts/import_playlists.py
      - .github/workflows/import-playlists.yml

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[playlist-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playlist importer
        run: python -m pip install --upgrade yt-dlp
      - name: Import playlist curriculum
        run: python scripts/import_playlists.py
      - name: Commit imported metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/playlist-data.json
          if git diff --cached --quiet; then
            echo "Playlist metadata is already current."
            exit 0
          fi
          git commit -m "Import exact YouTube course curriculum [playlist-import]"
          git push origin HEAD:main

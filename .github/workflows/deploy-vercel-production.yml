name: FINISH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finish-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare product source
        run: npm run prepare:product

      - name: Verify launch invariants
        run: npm run verify:launch

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build application
        run: npx vite build

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: finish-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Native deployment note
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "Vercel Git integration deploys this exact main-branch commit to production after the push."

name: Stabilize YouTube player ownership

on:
  push:
    branches: [main]
    paths:
      - scripts/stabilize_youtube_player_host.py
      - .github/workflows/stabilize-youtube-player.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-player-architecture
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[stable-player-host]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply React-safe player architecture
        run: python scripts/stabilize_youtube_player_host.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Verify DOM ownership contract
        run: |
          grep -q "playerHost = useRef<HTMLDivElement" src/main.tsx
          grep -q "new window.YT.Player(mount" src/main.tsx
          grep -q "youtube-player-host" src/main.tsx
          ! grep -q "player.current?.destroy()" src/main.tsx
          ! grep -q 'id="youtube-player"' src/main.tsx
      - name: Commit verified player architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          if git diff --cached --quiet; then
            echo "Stable player host already applied."
            exit 0
          fi
          git commit -m "Isolate YouTube DOM from React ownership [stable-player-host]"
          git push origin HEAD:main

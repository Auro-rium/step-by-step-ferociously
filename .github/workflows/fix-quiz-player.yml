name: Release systemic learning progression

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_quiz_to_lesson_player.py
      - .github/workflows/fix-quiz-player.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-learning-progression-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[systemic-progression]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply generic learning-engine fix
        run: python scripts/fix_quiz_to_lesson_player.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Verify systemic progression contract
        run: |
          grep -q "continueFromServerStep" src/main.tsx
          grep -q "payload.next_step" src/main.tsx
          grep -q "key={videoIds\[index\]}" src/main.tsx
          grep -q "activeQuiz?.id, index" src/main.tsx
          ! grep -q "continueFromQuiz" src/main.tsx
          ! grep -q "player.current?.cueVideoById(exactVideoId)" src/main.tsx
      - name: Commit verified product release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          if git diff --cached --quiet; then
            echo "Systemic progression release already applied."
            exit 0
          fi
          git commit -m "Use backend-driven progression for every course [systemic-progression]"
          git push origin HEAD:main

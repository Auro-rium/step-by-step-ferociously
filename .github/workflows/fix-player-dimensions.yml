name: Fix player dimensions

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_player_dimensions.py
      - .github/workflows/fix-player-dimensions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-player-dimensions
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[player-dimensions]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply system-wide player sizing
        run: python scripts/fix_player_dimensions.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate production build
        run: npm run build
      - name: Verify full-frame player contract
        run: |
          grep -q "FINISH stable YouTube player sizing" src/styles.css
          grep -q ".youtube-player-host iframe" src/styles.css
          grep -q "aspect-ratio: 16 / 9" src/styles.css
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css
          if git diff --cached --quiet; then
            echo "Player sizing already applied."
            exit 0
          fi
          git commit -m "Restore full-frame YouTube player sizing [player-dimensions]"
          git push origin HEAD:main

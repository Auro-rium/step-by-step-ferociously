<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Follow a YouTube course in order, check what you learned, and return to the right lesson." />
  <meta name="color-scheme" content="light dark" />
  <title>FINISH. — Finish the course you started.</title>
  <script>
    (() => {
      const saved = localStorage.getItem('finish-theme');
      const theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/theme.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://www.youtube.com/iframe_api"></script>
  <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script defer src="/js/01-core.js"></script>
  <script defer src="/js/02-public-auth.js"></script>
  <script defer src="/js/02a-site-polish.js"></script>
  <script defer src="/js/09-theme.js"></script>
  <script defer src="/js/03-home-checkout.js"></script>
  <script defer src="/js/04-learn-player.js"></script>
  <script defer src="/js/05-learn-route-quiz.js"></script>
  <script defer src="/js/06-admin.js"></script>
  <script defer src="/js/07-router.js"></script>
  <script defer src="/js/08-auth-recovery.js"></script>
</head>
<body>
  <div id="app"><div class="boot-screen">Loading FINISH.</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>

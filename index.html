<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Follow a YouTube course in order, check what you learned, and return to the right lesson." />
  <meta name="color-scheme" content="light dark" />
  <title>FINISH. — Finish the course you started.</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('finish-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }

      window.__finishBootGuard = setTimeout(() => {
        const root = document.querySelector('#app');
        if (!root?.querySelector('.boot-screen')) return;
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:system-ui,sans-serif">
            <section style="max-width:560px">
              <strong style="font-size:22px">FINISH.</strong>
              <h1 style="font:500 52px/1 Georgia,serif;margin:24px 0 14px">The app did not start.</h1>
              <p style="line-height:1.65">Reload once. If this screen returns, the browser is holding an old app session.</p>
              <button onclick="localStorage.clear();location.reload()" style="border:0;border-radius:6px;background:#111;color:#fff;font-weight:800;padding:14px 18px;cursor:pointer">Clear old session and reload</button>
            </section>
          </main>`;
      }, 10000);
    })();
  </script>
  <link rel="stylesheet" href="/api/static?path=styles.css&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec" />
  <link rel="stylesheet" href="/api/static?path=theme.css&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://www.youtube.com/iframe_api"></script>
  <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script defer src="/api/static?path=js%2F01-core.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>
  <script defer src="/api/static?path=js%2F01a-auth-safety.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>
  <script defer src="/api/static?path=js%2F02-public-auth.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>
  <script defer src="/api/static?path=js%2F02a-site-polish.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>
  <script defer src="/api/static?path=js%2F09-theme.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>
  <script defer src="/api/static?path=js%2F03-home-checkout.js&ref=d9adce256cea4308e94c3e90110d68ed271ca8ec"></script>

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Follow a YouTube course in order, check what you learned, and return to the right lesson." />
  <meta name="color-scheme" content="light dark" />
  <title>FINISH. — Finish the course you started.</title>
  <script>
    (() => {
      const ASSET_REF = '3e8ad41d81c719da615d7f5beba8b776d9b3d4b6';
      const BUILD = '20260801-1456';
      let currentAsset = 'startup';

      try {
        const saved = localStorage.getItem('finish-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }

      function clearFinishSession() {
        try {
          Object.keys(localStorage)
            .filter((key) => key.startsWith('sb-') || key.startsWith('finish-'))
            .forEach((key) => {
              if (key !== 'finish-theme') localStorage.removeItem(key);
            });
          sessionStorage.clear();
        } catch {}
        location.replace(`${location.pathname}?boot=${Date.now()}`);
      }

      function showBootError(error) {
        const root = document.querySelector('#app');
        if (!root) return;
        const detail = error?.message || String(error || 'Unknown startup error');
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#f3eee4;color:#11110f;font-family:system-ui,sans-serif">
            <section style="max-width:620px;border:1px solid #d2c9bb;border-radius:14px;padding:32px;background:#fbf7ef">
              <strong style="font-size:22px">FINISH.</strong>
              <h1 style="font:500 50px/1 Georgia,serif;margin:24px 0 14px">The app could not start.</h1>
              <p style="line-height:1.65">Startup stopped at <b>${currentAsset}</b>.</p>
              <p style="line-height:1.65;color:#6f6a62">${detail}</p>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px">
                <button onclick="location.reload()" style="border:0;border-radius:6px;background:#111;color:#fff;font-weight:800;padding:14px 18px;cursor:pointer">Reload</button>
                <button id="clear-finish-session" style="border:1px solid #111;border-radius:6px;background:transparent;color:#111;font-weight:800;padding:14px 18px;cursor:pointer">Clear old session</button>
              </div>
            </section>
          </main>`;
        document.querySelector('#clear-finish-session')?.addEventListener('click', clearFinishSession);
      }

      function loadScript(src, label, timeoutMs = 12000) {
        currentAsset = label;
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            script.remove();
            reject(new Error(`${label} timed out`));
          }, timeoutMs);
          script.src = src;
          script.async = false;
          script.onload = () => {
            clearTimeout(timer);
            resolve();
          };
          script.onerror = () => {
            clearTimeout(timer);
            reject(new Error(`${label} failed to download`));
          };
          document.head.append(script);
        });
      }

      function assetUrl(path) {
        return `/api/static?path=${encodeURIComponent(path)}&ref=${ASSET_REF}&build=${BUILD}`;
      }

      async function bootFinish() {
        try {
          await loadScript(`/api/vendor?name=supabase&build=${BUILD}`, 'Supabase client', 15000);
          if (!window.supabase?.createClient) throw new Error('Supabase client loaded without createClient');

          const files = [
            'js/01-core.js',
            'js/01a-auth-safety.js',
            'js/02-public-auth.js',
            'js/02a-site-polish.js',
            'js/09-theme.js',
            'js/03-home-checkout.js',
            'js/04-learn-player.js',
            'js/05-learn-route-quiz.js',
            'js/06-admin.js',
            'js/00-external-loaders.js',
            'js/08-auth-recovery.js',
            'js/07-router.js',
          ];

          for (const file of files) await loadScript(assetUrl(file), file);
          currentAsset = 'complete';
        } catch (error) {
          console.error('FINISH boot failed at', currentAsset, error);
          showBootError(error);
        }
      }

      window.addEventListener('DOMContentLoaded', bootFinish, { once: true });
    })();
  </script>
  <link rel="stylesheet" href="/api/static?path=styles.css&ref=3e8ad41d81c719da615d7f5beba8b776d9b3d4b6&build=20260801-1456" />
  <link rel="stylesheet" href="/api/static?path=theme.css&ref=3e8ad41d81c719da615d7f5beba8b776d9b3d4b6&build=20260801-1456" />
</head>
<body>
  <div id="app"><div class="boot-screen">Loading FINISH.</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
